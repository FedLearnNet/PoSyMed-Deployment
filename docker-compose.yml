services:
  posymed-notice:
    image: ghcr.io/fedlearnnet/posymed-deployment/posymed-notice:latest
    build: .
    restart: always
    pull_policy: always
    # Same host port the old PoSyMed reverse proxy used, so an existing
    # upstream proxy (e.g. https://apps.cosy.bio/posymed) keeps working.
    ports:
      - "8291:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
