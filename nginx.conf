# Full nginx config for the PoSyMed -> FL-Net notice page.
# Runs as the non-root nginx user of the Chainguard image, so it listens on
# 8080 and keeps all writable paths under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_types text/plain text/css;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /usr/share/nginx/html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nAllow: /\n";
        }

        # The page is only published under /posymed/ (see <base> in index.html).
        # Assets are served with and without that prefix, so it does not matter
        # whether the upstream proxy strips it.
        location ~ ^(?:/posymed)?/styles\.css$ {
            expires epoch;
            try_files /styles.css =404;
        }

        location ~ ^(?:/posymed)?/img/([A-Za-z0-9_-]+\.png)$ {
            expires 1d;
            try_files /img/$1 =404;
        }

        # Every other path, including old PoSyMed deep links
        # (/documentation, /auth, /api, ...), shows the notice directly.
        location / {
            expires epoch;
            try_files /index.html =404;
        }
    }
}
